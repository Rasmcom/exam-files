name: Bootstrap source

on:
  push:
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and unpack prepared source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-* > source.tar.gz.b64
          base64 --decode source.tar.gz.b64 > source.tar.gz
          echo "50dd2bafc1930ede2bfdf32225e0731903b40ba9523aa3a2404dafffcecf8cd4  source.tar.gz" | sha256sum -c -
          tar -xzf source.tar.gz
          rm -rf source.tar.gz source.tar.gz.b64 bootstrap .github/workflows/bootstrap.yml

      - name: Commit project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build secure single-user exam works cloud"
          git push
