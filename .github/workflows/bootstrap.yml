name: Bootstrap source

on:
  push:
    paths:
      - bootstrap-source.tar.gz.b64

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack prepared source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode bootstrap-source.tar.gz.b64 > source.tar.gz
          tar -xzf source.tar.gz
          rm -f source.tar.gz bootstrap-source.tar.gz.b64 .github/workflows/bootstrap.yml

      - name: Commit project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build secure single-user exam works cloud"
          git push
